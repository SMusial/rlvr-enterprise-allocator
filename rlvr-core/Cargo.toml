[package]
name = "rlvr-core"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = "0.33"
ndarray    = { version = "0.16", features = ["serde"] }
rand       = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tch        = { version = "0.14", features = [] }

[dev-dependencies]
approx = "0.5"
