[build-system]
requires      = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name            = "rlvr_py"
version         = "0.1.0"
description     = "Zero-copy PyO3 bridge for the RLVR Enterprise Allocator"
requires-python = ">=3.10"
license         = { text = "MIT" }

[tool.maturin]
features    = ["pyo3/extension-module"]
module-name = "rlvr_py"
